substitutions:
  name: garderobe-led
  friendly_name: Garderobe

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

# ESP32-C3 SuperMini logs over its native USB port
logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

# PWM outputs driving the MOSFETs
output:
  - platform: ledc
    id: pwm_clothes
    pin: GPIO3
    frequency: 2000Hz

  - platform: ledc
    id: pwm_shelves
    pin: GPIO4
    frequency: 2000Hz

# White LED strips: on/off + brightness only
light:
  - platform: monochromatic
    id: light_clothes
    name: "Clothes"
    icon: mdi:hanger
    output: pwm_clothes
    default_transition_length: 0.5s
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: monochromatic
    id: light_shelves
    name: "Shelves"
    icon: mdi:bookshelf
    output: pwm_shelves
    default_transition_length: 0.5s
    restore_mode: RESTORE_DEFAULT_OFF
